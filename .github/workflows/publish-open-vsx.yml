name: Publish Extension

on:
  release:
    types: [published]

jobs:
  publish-openvsx:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx ovsx publish *.vsix
